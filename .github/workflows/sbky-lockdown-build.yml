name: Build SBKY Lockdown

on:
  push:
    branches: [sbky-lockdown-build]
    paths:
      - 'sbky-lockdown/**'
      - '.github/workflows/sbky-lockdown-build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win --publish never
            artifact: windows
          - os: macos-14
            command: npx electron-builder --mac --arm64 --publish never
            artifact: mac-arm64
          - os: macos-14
            command: npx electron-builder --mac --x64 --publish never
            artifact: mac-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sbky-lockdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sbky-lockdown/package.json
      - name: Restore bundled alarm
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('assets/alarm.ogg',Buffer.from(fs.readFileSync('assets/alarm.b64','utf8').trim(),'base64'))"
          rm assets/alarm.b64
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build desktop package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: sbky-lockdown-${{ matrix.artifact }}
          path: |
            sbky-lockdown/dist/*.exe
            sbky-lockdown/dist/*.dmg
          if-no-files-found: error
